<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery · Photobooth</title>
<link rel="stylesheet" href="shared.css">
<style>
  .page-head {
    max-width: 1080px; margin: 0 auto;
    padding: 64px 24px 32px;
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
  }
  .page-head h1 {
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 700; letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--text) 30%, var(--text-dim));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .count { font-size: 14px; color: var(--text-dim); }

  /* Mode Switcher */
  .mode-switcher {
    display: flex; background: var(--surface);
    padding: 4px; border-radius: 980px;
    border: 1px solid var(--border);
  }
  .mode-btn {
    padding: 6px 14px; font-size: 13px; font-weight: 500;
    border-radius: 980px; border: none; background: transparent;
    color: var(--text-dim); cursor: pointer;
    transition: all .2s ease;
  }
  .mode-btn.active {
    background: var(--text);
    color: var(--bg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .feed {
    max-width: 1080px; margin: 0 auto;
    padding: 0 24px 120px;
    transition: all .4s cubic-bezier(.22, 1, .36, 1);
  }
  .feed.mode-masonry {
    columns: 3 260px;
    column-gap: 16px;
    display: block;
  }
  .feed.mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    columns: none;
  }
  .feed.mode-stories {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    columns: none;
  }

  .item { 
    animation: rise .5s cubic-bezier(.22,1,.36,1) both; 
    width: 100%;
    margin-bottom: 32px;
  }
  .item.mode-stories {
    max-width: 400px;
  }

  .photo-wrap {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: zoom-in;
    transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s ease;
  }
  .photo-wrap:hover {
    transform: translateY(-3px);
    box-shadow: 0 28px 60px -24px rgba(0,0,0,.55);
  }
  .photo-wrap img { width: 100%; display: block; }

  /* Edit Overlay */
  .edit-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
    z-index: 5;
  }
  .photo-wrap:hover .edit-overlay, 
  .photo-wrap.edit-active .edit-overlay {
    opacity: 1; pointer-events: auto;
  }
  .edit-btn {
    padding: 8px 16px; background: #fff; color: #000;
    border: none; border-radius: 980px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: transform .2s ease;
  }
  .edit-btn:hover { transform: scale(1.1); }

  /* Message delete button */
  .msg-del {
    position: absolute; right: 8px; top: 8px;
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(255,0,0,0.6); color: #fff;
    border: none; cursor: pointer; font-size: 12px;
    display: none; align-items: center; justify-content: center;
    transition: background .2s ease;
  }
  .bubble-msg.edit-visible .msg-del { display: flex; }
  .msg-del:hover { background: rgba(255,0,0,0.9); }

  /* Edit mode state */
  .item.edit-mode .bubble-msg { position: relative; }
  .item.edit-mode .composer { display: none; }

  /* Grid mode: force square aspect ratio */
  .mode-grid .photo-wrap img {
    aspect-ratio: 1/1;
    object-fit: cover;
  }

  /* Stories mode: focus on verticality */
  .mode-stories .photo-wrap img {
    max-height: 80vh;
    object-fit: contain;
    background: #000;
  }

  .photo-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px;
    font-size: 13px; color: var(--text-dim);
  }

  /* chat thread */
  .thread {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 14px;
  }
  .bubble-msg {
    max-width: 75%;
    padding: 9px 14px;
    font-size: 14px; line-height: 1.35;
    border-radius: 18px;
    animation: bubbleIn .35s cubic-bezier(.22,1,.36,1) both;
    word-break: break-word;
  }
  /* alternate left (gray) / right (blue), iMessage-style */
  .bubble-msg.left {
    align-self: flex-start;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }
  .bubble-msg.right {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(8px) scale(.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* message composer */
  .composer {
    display: flex; gap: 8px;
    margin-top: 12px;
    width: 100%;
    box-sizing: border-box;
  }
  .composer input {
    flex: 1;
    min-width: 0;
    padding: 11px 18px;
    font: inherit; font-size: 14px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 980px;
    outline: none;
    transition: border-color .2s ease, background .2s ease;
  }
  .composer input:focus { border-color: var(--accent); background: var(--surface-hover); }
  .composer input::placeholder { color: var(--text-dim); }
  .composer button {
    padding: 11px 16px;
    font: inherit; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--accent);
    border: none; border-radius: 980px;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.22,1,.36,1), opacity .2s;
    white-space: nowrap;
  }
  .composer button:hover { transform: scale(1.05); }
  .composer button:disabled { opacity: .4; transform: none; cursor: default; }

  .empty {
    text-align: center; padding: 80px 0;
    color: var(--text-dim); font-size: 15px;
  }

  .refresh-note {
    text-align: center;
    padding-bottom: 12px;
    font-size: 13px; color: var(--text-dim);
  }
  .refresh-actions {
    display: flex; justify-content: center; padding-bottom: 60px;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="wordmark" href="index.html">◉ Photobooth</a>
    <a class="nav-link" href="index.html">‹ Back to Booth</a>
  </div>
</nav>

<div class="page-head">
  <h1 id="galleryTitle">Gallery</h1>
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="mode-switcher" id="modeSwitcher">
      <button class="mode-btn active" data-mode="masonry">Masonry</button>
      <button class="mode-btn" data-mode="grid">Grid</button>
      <button class="mode-btn" data-mode="stories">Stories</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="feed mode-masonry" id="feed"></div>
<div class="empty hidden" id="empty">No photos yet — be the first from the booth.</div>
<div class="refresh-note" id="refreshNote"></div>
<div class="refresh-actions">
  <button class="btn-pill btn-ghost hidden" id="newContentBtn" type="button">New photos • Refresh</button>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"></div>

<script type="module">
  import { list, sendMessage, deleteItem } from './storage.js';
  import { $, toast, initLightbox } from './shared.js';

  const openLightbox = initLightbox();
  const MAX_MSG = 80;

  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleString(undefined, {
        day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'
      });
    } catch { return ''; }
  }

  function msgEl(m, i) {
    const d = document.createElement('div');
    d.className = 'bubble-msg ' + (i % 2 === 0 ? 'left' : 'right');
    d.style.animationDelay = Math.min(i * 70, 500) + 'ms';
    
    const text = document.createElement('span');
    text.textContent = m.t;
    d.appendChild(text);

    const del = document.createElement('button');
    del.className = 'msg-del';
    del.textContent = '×';
    del.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this message?')) return;
      const res = await deleteItem(m.at, 'message');
      if (res.ok) {
        d.remove();
        toast('Message removed');
      } else {
        toast('Delete failed: ' + res.error);
      }
    };
    d.appendChild(del);

    return d;
  }

  function renderItem(img, idx) {
    const item = document.createElement('div');
    item.className = 'item';
    item.style.animationDelay = Math.min(idx * 80, 600) + 'ms';

    // photo
    const wrap = document.createElement('div');
    wrap.className = 'photo-wrap';
    
    const overlay = document.createElement('div');
    overlay.className = 'edit-overlay';
    const editBtn = document.createElement('button');
    editBtn.className = 'edit-btn';
    editBtn.textContent = 'Edit';
    overlay.appendChild(editBtn);
    wrap.appendChild(overlay);

    const el = document.createElement('img');
    el.loading = 'lazy';
    el.src = img.url;
    el.alt = img.name;
    wrap.appendChild(el);
    wrap.addEventListener('click', (e) => {
      if (e.target === editBtn) return;
      openLightbox(img.url);
    });
    item.appendChild(wrap);

    // meta row
    const meta = document.createElement('div');
    meta.className = 'photo-meta';
    const when = document.createElement('span');
    when.textContent = fmtDate(img.created);
    const msgCount = document.createElement('span');
    const msgs = img.messages || [];
    msgCount.textContent = msgs.length ? `💬 ${msgs.length}` : '';
    meta.appendChild(when);
    meta.appendChild(msgCount);
    item.appendChild(meta);

    // thread
    const thread = document.createElement('div');
    thread.className = 'thread';
    msgs.forEach((m, i) => thread.appendChild(msgEl(m, i)));
    item.appendChild(thread);

    // composer
    const composer = document.createElement('form');
    composer.className = 'composer';
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = MAX_MSG;
    input.placeholder = 'Say something…';
    input.autocomplete = 'off';
    const btn = document.createElement('button');
    btn.type = 'submit';
    btn.textContent = 'Send';
    composer.appendChild(input);
    composer.appendChild(btn);
    item.appendChild(composer);

    // Edit mode logic
    editBtn.addEventListener('click', async () => {
      const isEdit = item.classList.toggle('edit-mode');
      wrap.classList.toggle('edit-active', isEdit);
      
      if (isEdit) {
        // Show delete buttons on bubbles
        thread.querySelectorAll('.bubble-msg').forEach(b => b.classList.add('edit-visible'));
        // Add delete button to image itself
        const delImgBtn = document.createElement('button');
        delImgBtn.className = 'edit-btn';
        delImgBtn.style.marginLeft = '12px';
        delImgBtn.style.background = '#ff4444';
        delImgBtn.style.color = '#fff';
        delImgBtn.textContent = 'Delete Photo';
        delImgBtn.onclick = async () => {
          if (!confirm('Delete this photo?')) return;
          const res = await deleteItem(img.id, 'image');
          if (res.ok) {
            toast('Photo deleted');
            item.remove();
          } else {
            toast('Delete failed: ' + res.error);
          }
        };
        overlay.appendChild(delImgBtn);
      } else {
        thread.querySelectorAll('.bubble-msg').forEach(b => b.classList.remove('edit-visible'));
        const delBtn = overlay.querySelector('button:last-child');
        if (delBtn && delBtn.textContent === 'Delete Photo') delBtn.remove();
      }
    });

    composer.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      btn.disabled = true;
      try {
        const res = await sendMessage(img.id, text);
        if (res.ok) {
          const newMsg = msgEl({ t: text }, msgs.length);
          // add delete button to new message if in edit mode
          if (item.classList.contains('edit-mode')) newMsg.classList.add('edit-visible');
          thread.appendChild(newMsg);
          input.value = '';
          msgCount.textContent = `💬 ${msgs.length + 1}`;
          msgs.push({ t: text });
        } else {
          toast('Message failed: ' + res.error);
        }
      } catch {
        toast('Message failed — backend not reachable');
      }
      btn.disabled = false;
      input.focus();
    });

    return item;
  }

  let latestImages = [];
  const newContentBtn = $('newContentBtn');

  function renderGallery(images) {
    const currentMode = $('feed').className.split(' ').find(c => c.startsWith('mode-'));
    $('feed').innerHTML = '';
    $('count').textContent = images.length + (images.length === 1 ? ' photo' : ' photos');
    $('empty').classList.toggle('hidden', images.length > 0);
    images.forEach((img, i) => {
      const item = renderItem(img, i);
      if (currentMode === 'mode-stories') item.classList.add('mode-stories');
      $('feed').appendChild(item);
    });
  }

  function showNewContentNotice(count) {
    if (!count) {
      newContentBtn.classList.add('hidden');
      newContentBtn.textContent = 'New photos • Refresh';
      return;
    }
    newContentBtn.classList.remove('hidden');
    newContentBtn.textContent = count === 1 ? 'New photo • Refresh' : `New photos (${count}) • Refresh`;
  }

  async function refresh({ force = false } = {}) {
    try {
      const res = await list();
      if (!res.ok) throw new Error(res.error);
      const images = res.images || [];
      const hasPrevious = latestImages.length > 0;
      const newCount = !hasPrevious ? 0 : images.filter(img => !latestImages.some(old => old.id === img.id)).length;

      if (!force && hasPrevious && newCount > 0) {
        latestImages = images;
        $('refreshNote').textContent = 'Checking every 20 seconds';
        showNewContentNotice(newCount);
        return;
      }

      latestImages = images;
      renderGallery(images);
      $('refreshNote').textContent = 'Checking every 20 seconds';
      showNewContentNotice(0);
    } catch {
      $('empty').classList.remove('hidden');
      $('empty').textContent = 'Gallery unavailable — backend not connected yet.';
      $('refreshNote').textContent = '';
      showNewContentNotice(0);
    }
  }

  newContentBtn.addEventListener('click', () => {
    refresh({ force: true });
  });

  /* ---------- Mode Switching ---------- */
  $('modeSwitcher').addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    const mode = btn.dataset.mode;

    // Update buttons
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Update feed class
    const feed = $('feed');
    feed.className = 'feed mode-' + mode;

    // Rerender items to apply mode-specific classes (like .mode-stories)
    refresh({ force: true });
  });

  refresh({ force: true });
  setInterval(() => refresh(), 20000);
</script>
</body>
</html>
